name: Build Night Dream APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'night-dream.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          rm -rf project
          mkdir project
          unzip -q night-dream.zip -d project

          SETTINGS=$(find project -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Gradle project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory: $PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Remove duplicate sourceSets configuration
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")

          if not p.exists():
              raise SystemExit("app/build.gradle.kts not found")

          text = p.read_text()

          def remove_block(text, keyword):
              start = text.find(keyword)

              while start != -1:
                  brace = text.find("{", start)

                  if brace == -1:
                      break

                  depth = 0
                  quote = None
                  escape = False
                  end = None

                  for i in range(brace, len(text)):
                      c = text[i]

                      if quote:
                          if escape:
                              escape = False
                          elif c == "\\":
                              escape = True
                          elif c == quote:
                              quote = None
                          continue

                      if c in ('"', "'"):
                          quote = c
                          continue

                      if c == "{":
                          depth += 1
                      elif c == "}":
                          depth -= 1

                          if depth == 0:
                              end = i + 1
                              break

                  if end is None:
                      break

                  text = text[:start] + text[end:]
                  start = text.find(keyword)

              return text

          # Remove every custom sourceSets block.
          text = remove_block(text, "sourceSets")

          p.write_text(text)

          print("Custom sourceSets configuration removed.")
          PY

          echo "Checking remaining sourceSets:"
          grep -n "sourceSets" app/build.gradle.kts || true

      - name: Clean Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew clean --no-daemon
          else
            gradle clean --no-daemon
          fi

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Find APK
        run: |
          APK=$(find "${PROJECT_DIR}/app/build/outputs/apk" -type f -name "*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          echo "APK FOUND: $APK"
          cp "$APK" night-dream-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Night-Dream-APK
          path: night-dream-debug.apk
