name: Build Night Dream APK

on:
  workflow_dispatch:
  push:
    paths:
      - "night-dream.zip"
      - ".github/workflows/main.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Night Dream
        run: |
          rm -rf project
          mkdir project
          unzip -q night-dream.zip -d project

          echo "Project files:"
          find project -maxdepth 4 -type f | sort | head -200

      - name: Locate Gradle Project
        run: |
          SETTINGS=$(find project -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Gradle settings file not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Gradle project:"
          echo "$PROJECT_DIR"

      - name: Prepare Android Resources
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "Checking Android resource directories..."

          find . -type d -path "*/src/*/res" -print

          echo ""
          echo "Checking launcher resources..."

          find . -type f \( \
            -name "ic_launcher.webp" -o \
            -name "ic_launcher_round.webp" \
          \) -print

          echo ""
          echo "Removing duplicate launcher files..."

          python3 <<'PY'
          import os
          from collections import defaultdict

          found = defaultdict(list)

          for root, dirs, files in os.walk("."):
              # Never modify build/cache directories
              dirs[:] = [
                  d for d in dirs
                  if d not in {
                      ".gradle",
                      "build",
                      ".git"
                  }
              ]

              for f in files:
                  if f in {
                      "ic_launcher.webp",
                      "ic_launcher_round.webp"
                  }:
                      found[f].append(os.path.join(root, f))

          for name, files in found.items():
              print(f"\n{name}:")
              for f in files:
                  print("  ", f)

              # Keep the first actual source copy.
              # Remove exact duplicates from additional resource directories.
              if len(files) > 1:
                  keep = files[0]
                  print("KEEP:", keep)

                  for duplicate in files[1:]:
                      print("REMOVE:", duplicate)
                      os.remove(duplicate)

          print("\nResource cleanup complete.")
          PY

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Executable
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Clean Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew clean --no-daemon
          else
            gradle clean --no-daemon
          fi

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Find APK
        run: |
          echo "Searching for APK..."

          APK=$(find "${PROJECT_DIR}" \
            -type f \
            -name "*.apk" \
            -not -path "*/build/intermediates/*" \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          cp "$APK" night-dream-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Night-Dream-APK
          path: night-dream-debug.apk
          if-no-files-found: error
