name: Build Night Dream APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'night-dream.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          rm -rf project
          mkdir project
          unzip -q night-dream.zip -d project

          SETTINGS=$(find project -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Gradle project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project: $PROJECT_DIR"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fix duplicate Android resource directories
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          BUILD_FILE="app/build.gradle.kts"

          if [ ! -f "$BUILD_FILE" ]; then
            echo "ERROR: $BUILD_FILE not found"
            exit 1
          fi

          cp "$BUILD_FILE" "$BUILD_FILE.backup"

          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          lines = s.splitlines()
          out = []

          for line in lines:
              stripped = line.strip()

              if "res.srcDirs" in stripped:
                  continue

              if "res.srcDir" in stripped:
                  continue

              out.append(line)

          s = "\n".join(out) + "\n"

          p.write_text(s)
          PY

          echo "Duplicate resource directory configuration cleaned."

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew clean assembleDebug --no-daemon
          else
            gradle clean assembleDebug --no-daemon
          fi

      - name: Find APK
        run: |
          APK=$(find "${PROJECT_DIR}" -type f -name "*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          echo "APK found: $APK"
          cp "$APK" night-dream-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Night-Dream-APK
          path: night-dream-debug.apk
