name: Build Night Dream APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'night-dream.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          rm -rf project
          mkdir project
          unzip -q night-dream.zip -d project

          SETTINGS=$(find project -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "Gradle project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Remove duplicate Android resource configuration
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle.kts")
          if not p.exists():
              raise SystemExit("app/build.gradle.kts not found")

          s = p.read_text()

          # Remove Android sourceSets blocks that redefine resource directories.
          pattern = r'(?s)sourceSets\s*\{.*?\n\s*\}'

          def clean_block(m):
              block = m.group(0)

              # Remove resource-directory declarations.
              block = re.sub(
                  r'(?m)^\s*(res\s*\.\s*(srcDir|srcDirs)\s*\(.*\)|res\s*\.\s*(srcDir|srcDirs)\s*=\s*.*)\s*$',
                  '',
                  block
              )

              return block

          s = re.sub(pattern, clean_block, s)

          # Remove direct duplicate res.srcDir/srcDirs lines anywhere.
          s = re.sub(
              r'(?m)^\s*.*res\s*\.\s*(srcDir|srcDirs)\s*\(.*\)\s*$\n?',
              '',
              s
          )

          p.write_text(s)
          print("Resource configuration cleaned.")
          PY

      - name: Clean Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew clean --no-daemon
          else
            gradle clean --no-daemon
          fi

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Locate APK
        run: |
          APK=$(find "${PROJECT_DIR}/app/build/outputs/apk" -type f -name "*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "APK NOT FOUND"
            find "${PROJECT_DIR}/app/build/outputs" -type f || true
            exit 1
          fi

          echo "APK FOUND: $APK"
          cp "$APK" night-dream-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Night-Dream-APK
          path: night-dream-debug.apk
